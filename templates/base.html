<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المنصة التعليمية للأستاذ ناصري فاتح</title>
    <style>
        body { font-family: Tahoma, sans-serif; margin: 0; background-color: #f4f6f9; color: #333; }
        header { background: #2c3e50; color: #fff; padding: 15px 20px; text-align: center; }
        nav { background: #34495e; padding: 12px; text-align: center; }
        nav a { color: white; text-decoration: none; margin: 0 12px; font-weight: bold; font-size: 15px; }
        nav a:hover { color: #1abc9c; }
        .container { padding: 30px; max-width: 1000px; margin: auto; background: white; margin-top: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 50px; }
        .badge-pdf { background: #e67e22; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-word { background: #2980b9; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-free { background: #27ae60; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>المنصة التعليمية الرقمية - الأستاذ ناصري فاتح</h1>
    </header>

    <nav>
        <a href="{{ url_for('home') }}">الرئيسية</a>
        <a href="{{ url_for('lessons') }}">الدروس</a>
        <a href="{{ url_for('exercises') }}">التمارين</a>
        <a href="{{ url_for('exams_page') }}">الفروض والاختبارات</a>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
