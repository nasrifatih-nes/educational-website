{% extends "base.html" %}
{% block content %}
<h2>إضافة فرض أو اختبار جديد</h2>

<form method="POST" enctype="multipart/form-data" style="background: #f8f9fa; padding: 20px; border-radius: 5px; border: 1px solid #ddd;">
    <div style="margin-bottom: 15px;">
        <label><strong>عنوان الموضوع:</strong></label><br>
        <input type="text" name="title" required placeholder="مثال: الفرض المحروس رقم 01 في علوم الطبيعة والحياة" style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <div style="margin-bottom: 15px;">
        <label><strong>نوع العمل:</strong></label><br>
        <select name="type" style="width: 100%; padding: 8px; margin-top: 5px;">
            <option value="فرض">فرض</option>
            <option value="اختبار">اختبار</option>
        </select>
    </div>

    <div style="margin-bottom: 15px;">
        <label><strong>المستوى الدراسي:</strong></label><br>
        <select name="level" style="width: 100%; padding: 8px; margin-top: 5px;">
            {% for lvl in levels %}
                <option value="{{ lvl }}">{{ lvl }}</option>
            {% endfor %}
        </select>
    </div>

    <div style="margin-bottom: 15px;">
        <label><strong>الفصل الدراسي:</strong></label><br>
        <select name="semester" style="width: 100%; padding: 8px; margin-top: 5px;">
            {% for sem in semesters %}
                <option value="{{ sem }}">{{ sem }}</option>
            {% endfor %}
        </select>
    </div>

    <hr style="margin: 20px 0;">
    <h3>ملف الموضوع (رفع مباشر أو رابط درايف):</h3>
    <div style="margin-bottom: 10px;">
        <label>رفع ملف الموضوع من الحاسوب:</label><br>
        <input type="file" name="subject_file_upload" style="margin-top: 5px;">
    </div>
    <div style="margin-bottom: 10px;">
        <label>أو رابط Google Drive للموضوع:</label><br>
        <input type="text" name="subject_file_link" placeholder="https://drive.google.com/..." style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>
    <div style="margin-bottom: 15px;">
        <label><strong>اشتراك موضوع الفرض/الاختبار:</strong></label><br>
        <select name="subject_sub_type" style="width: 100%; padding: 8px; margin-top: 5px;">
            <option value="free">مجاني</option>
            <option value="pdf_sub">اشتراك فصلي PDF (أقل سعراً)</option>
            <option value="word_sub">اشتراك فصلي Word (سعر خاص)</option>
        </select>
    </div>

    <hr style="margin: 20px 0;">
    <h3>ملف التصحيح النموذجي (رفع مباشر أو رابط درايف):</h3>
    <div style="margin-bottom: 10px;">
        <label>رفع ملف التصحيح من الحاسوب:</label><br>
        <input type="file" name="correction_file_upload" style="margin-top: 5px;">
    </div>
    <div style="margin-bottom: 10px;">
        <label>أو رابط Google Drive للتصحيح:</label><br>
        <input type="text" name="correction_file_link" placeholder="https://drive.google.com/..." style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>
    <div style="margin-bottom: 15px;">
        <label><strong>اشتراك التصحيح النموذجي:</strong></label><br>
        <select name="correction_sub_type" style="width: 100%; padding: 8px; margin-top: 5px;">
            <option value="free">مجاني</option>
            <option value="pdf_sub">اشتراك فصلي PDF (أقل سعراً)</option>
            <option value="word_sub">اشتراك فصلي Word (سعر خاص)</option>
        </select>
    </div>

    <button type="submit" style="padding: 12px 25px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px;">حفظ ونشر الموضوع والتصحيح</button>
    <a href="{{ url_for('exams_page') }}" style="margin-right: 15px; text-decoration: none; color: #555;">العودة للقائمة</a>
</form>
{% endblock %}
